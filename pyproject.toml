[project]
name = "rendereye-mcp"
version = "1.0.0"
description = "MCP server bridging AI assistants to RenderDoc GPU frame debugger"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "taqu", email = "taqu2920.dev@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.3.0",
    "psutil>=7.2.2",
    "python-dotenv>=1.2.4",
    "watchdog>=6.0.0",
    "tomlkit>=0.13.3,<1",
]

[project.urls]
Homepage = "https://github.com/taqu/RenderEyeMCP"
Documentation = "https://github.com/taqu/RenderEyeMCP#readme"
Issues = "https://github.com/taqu/RenderEyeMCP/issues"

[project.scripts]
rendereye-mcp = "rendereye_mcp.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/rendereye_mcp"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "detect-secrets>=1.5.0",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.bandit]
exclude_dirs = ["tests", "venv", "dist", "build"]
