name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-probe:
    name: Go Protocol Probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build Go probe
        run: go build ./tools/ipc-probe/...
      - name: Run Go probe in mock mode
        run: go run ./tools/ipc-probe/... -mock
      - name: Run Go fixture check
        run: go run ./tools/ipc-probe/... -fixtures tests/protocol/fixtures

  install-verify:
    name: Install Verify (${{ matrix.os }} / Python ${{ matrix.python-version }})
    needs: build-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Build wheel
        run: uv build --wheel
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install wheel in clean virtual environment (no uv)
        shell: bash
        run: |
          python -m venv ci-install-env
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            VENV_BIN=ci-install-env/Scripts
          else
            VENV_BIN=ci-install-env/bin
          fi
          $VENV_BIN/python -m pip install --upgrade pip
          $VENV_BIN/python -m pip install dist/*.whl
          $VENV_BIN/python -c "import rendereye_mcp; print('Version:', rendereye_mcp.__version__)"
          $VENV_BIN/python -c "from rendereye_mcp.__main__ import main; print('Entry point: OK')"
          $VENV_BIN/python -m rendereye_mcp --help 2>/dev/null || true
