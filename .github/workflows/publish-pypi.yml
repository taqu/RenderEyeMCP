name: Publish to PyPI

# Triggered by any tag starting with "v". The classify job validates the tag
# and rejects everything that is not a production release (vMAJOR.MINOR.PATCH).
# Test tags (v*-test.*) and invalid tags cause the workflow to fail before any
# build or publish step runs.
#
# This workflow publishes EXCLUSIVELY to production PyPI.
# It never contains a TestPyPI publishing job.
# Trusted Publisher registration: workflow=publish-pypi.yml, environment=pypi
on:
  push:
    tags:
      - "v*"

# Prevent duplicate publishes for the same tag. Do not cancel once a publishing
# job may have started — PyPI does not allow replacing an uploaded distribution.
concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  # ──────────────────────────────────────────────────────────────────────────
  # CLASSIFY: validate the Git tag is a production release.
  # Rejects test tags (v*-test.*) and any other non-production tag.
  # ──────────────────────────────────────────────────────────────────────────
  classify:
    name: Validate Production Tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.cls.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync
      - name: Classify tag
        id: cls
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Tag: $TAG"
          uv run python scripts/classify_tag.py --gha "$TAG"
          uv run python scripts/classify_tag.py "$TAG"
      - name: Reject non-production tags
        shell: bash
        run: |
          KIND="${{ steps.cls.outputs.kind }}"
          TAG="${GITHUB_REF#refs/tags/}"
          if [ "$KIND" != "production" ]; then
            echo "ERROR: Tag '$TAG' is not a production tag (kind=$KIND)."
            echo "  Production tags must match vMAJOR.MINOR.PATCH (e.g. v1.0.0)."
            echo "  Test tags (v*-test.*) must use the publish-testpypi.yml workflow."
            exit 1
          fi
          echo "Production tag confirmed: $TAG -> ${{ steps.cls.outputs.version }}"

  # ──────────────────────────────────────────────────────────────────────────
  # BUILD: build and validate the production Python distributions.
  # Runs only after classify confirms a production tag.
  # ──────────────────────────────────────────────────────────────────────────
  build:
    name: Build Distributions
    needs: [classify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      # Version in source files must already match the production tag.
      - name: Validate production tag matches source version
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          uv run python scripts/validate_release.py --check-versions --tag "$TAG"

      - name: Build wheel and source distribution
        run: uv build

      - name: Verify built distribution version matches expected
        shell: bash
        run: |
          EXPECTED="${{ needs.classify.outputs.version }}"
          WHL=$(ls dist/*.whl | head -1)
          ACTUAL=$(python -c "
          whl = '$WHL'.replace('\\\\', '/').split('/')[-1]
          print(whl.split('-')[1])
          ")
          echo "Expected version: $EXPECTED"
          echo "Wheel version:    $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ERROR: Version mismatch — aborting before upload."
            exit 1
          fi

      - name: Validate distributions with twine
        run: uvx twine check dist/*.whl dist/*.tar.gz

      - name: Install wheel in clean venv (smoke test)
        shell: bash
        run: |
          python -m venv build-verify-env
          build-verify-env/bin/pip install --upgrade pip --quiet
          build-verify-env/bin/pip install dist/*.whl --quiet
          build-verify-env/bin/python -c "
          import rendereye_mcp
          expected = '${{ needs.classify.outputs.version }}'
          actual   = rendereye_mcp.__version__
          assert actual == expected, f'Version mismatch: {actual!r} != {expected!r}'
          print('Installed version OK:', actual)
          "
          build-verify-env/bin/python -c "from rendereye_mcp.__main__ import main; print('Entry point OK')"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist-${{ needs.classify.outputs.version }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # PUBLISH TO PYPI: production tags only.
  # Uses the "pypi" GitHub Environment and OIDC Trusted Publishing.
  # This is the only publishing job in this workflow — TestPyPI is handled
  # exclusively by publish-testpypi.yml.
  # ──────────────────────────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: [classify, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rendereye-mcp/${{ needs.classify.outputs.version }}
    permissions:
      id-token: write   # Required for OIDC Trusted Publishing — granted only here
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-dist-${{ needs.classify.outputs.version }}
          path: dist/
      - name: Final production guard
        shell: bash
        run: |
          VERSION="${{ needs.classify.outputs.version }}"
          # Confirm the version looks like a production release (no .dev, .a, .b, .rc)
          if echo "$VERSION" | grep -qE '\.(dev|a|b|rc)'; then
            echo "ERROR: Version '$VERSION' is not a production release — aborting."
            exit 1
          fi
          echo "Publishing version $VERSION to production PyPI."
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
