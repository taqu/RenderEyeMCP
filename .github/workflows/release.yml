name: Release Go Binary

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish GitHub Release (false = dry run / artifacts only)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ── Extract version ─────────────────────────────────────────────────────────
  version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag:     ${{ steps.ver.outputs.tag }}
      commit:  ${{ steps.ver.outputs.commit }}
      date:    ${{ steps.ver.outputs.date }}
      is_prerelease: ${{ steps.ver.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract metadata
        id: ver
        shell: bash
        run: |
          # Version comes from the git tag (e.g. v1.0.0 → 1.0.0).
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="dev"
          fi
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"     >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT"    >> "$GITHUB_OUTPUT"
          echo "date=$DATE"        >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *"-"* ]]; then
            echo "is_prerelease=true"  >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Version: $VERSION  Commit: $COMMIT  Date: $DATE"

  # ── Go tests ────────────────────────────────────────────────────────────────
  test:
    name: Go Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Run Go tests
        run: go test ./...
      - name: Run Go vet
        run: go vet ./...

  # ── Cross-compile and package ────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    needs: [version, test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runner: windows-latest
            ext: .exe
            archive: zip
          - goos: windows
            goarch: arm64
            runner: windows-latest
            ext: .exe
            archive: zip
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            ext: ""
            archive: tar.gz
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
            ext: ""
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            ext: ""
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build rendereye-mcp
        shell: bash
        env:
          GOOS:   ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          COMMIT="${{ needs.version.outputs.commit }}"
          DATE="${{ needs.version.outputs.date }}"
          LDFLAGS="-s -w \
            -X github.com/taqu/rendereye-mcp/internal/version.Version=${VERSION} \
            -X github.com/taqu/rendereye-mcp/internal/version.GitCommit=${COMMIT} \
            -X github.com/taqu/rendereye-mcp/internal/version.BuildDate=${DATE}"
          go build -ldflags "$LDFLAGS" -o "rendereye-mcp${{ matrix.ext }}" ./cmd/rendereye-mcp/

      - name: Verify version output
        shell: bash
        run: |
          if [[ "${{ matrix.goos }}" == "$(go env GOHOSTOS)" && "${{ matrix.goarch }}" == "$(go env GOHOSTARCH)" ]]; then
            ./rendereye-mcp${{ matrix.ext }} version
          else
            echo "Cross-compiled (${{ matrix.goos }}/${{ matrix.goarch }}) — skipping native version check"
          fi

      - name: Assemble archive contents
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          ARCHIVE_NAME="rendereye-mcp_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "$ARCHIVE_NAME"
          cp "rendereye-mcp${{ matrix.ext }}" "$ARCHIVE_NAME/"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            # install.ps1 expects an "extensions" directory alongside the script
            mkdir -p "$ARCHIVE_NAME/extensions"
            cp -r extensions/rendereye/. "$ARCHIVE_NAME/extensions/"
            cp scripts/install.ps1 "$ARCHIVE_NAME/"
          else
            # install.sh expects an "extension" directory alongside the script
            mkdir -p "$ARCHIVE_NAME/extension"
            cp -r extensions/rendereye/. "$ARCHIVE_NAME/extension/"
            cp scripts/install.sh "$ARCHIVE_NAME/"
            chmod +x "$ARCHIVE_NAME/install.sh"
          fi
          if [[ -f README.md ]]; then cp README.md "$ARCHIVE_NAME/"; fi
          if [[ -f LICENSE ]];    then cp LICENSE   "$ARCHIVE_NAME/"; fi
          echo "$ARCHIVE_NAME" > archive_name.txt

      - name: Create archive (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          ARCHIVE_NAME=$(cat archive_name.txt)
          cd "$ARCHIVE_NAME" && zip -r "../${ARCHIVE_NAME}.zip" . && cd ..

      - name: Create archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          ARCHIVE_NAME=$(cat archive_name.txt)
          tar -czf "${ARCHIVE_NAME}.tar.gz" "$ARCHIVE_NAME/"

      - name: Generate checksum
        shell: bash
        run: |
          ARCHIVE_NAME=$(cat archive_name.txt)
          EXT="${{ matrix.archive }}"
          FILE="${ARCHIVE_NAME}.${EXT}"
          if command -v sha256sum &>/dev/null; then
            sha256sum "$FILE" > "${FILE}.sha256"
          else
            shasum -a 256 "$FILE" > "${FILE}.sha256"
          fi
          cat "${FILE}.sha256"

      - name: Verify archive contents
        shell: bash
        run: |
          ARCHIVE_NAME=$(cat archive_name.txt)
          EXT="${{ matrix.archive }}"
          if [[ "$EXT" == "zip" ]]; then
            unzip -l "${ARCHIVE_NAME}.zip" | grep -q "rendereye-mcp"
          else
            tar -tzf "${ARCHIVE_NAME}.tar.gz" | grep -q "rendereye-mcp"
          fi
          echo "Archive verification passed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            rendereye-mcp_*.${{ matrix.archive }}
            rendereye-mcp_*.sha256
          retention-days: 30

  # ── Collect all checksums ────────────────────────────────────────────────────
  checksums:
    name: Collect Checksums
    runs-on: ubuntu-latest
    needs: [version, build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: go-release-*
          merge-multiple: true
          path: artifacts/

      - name: Generate combined SHA256SUMS
        shell: bash
        run: |
          cd artifacts
          cat *.sha256 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload combined checksums
        uses: actions/upload-artifact@v4
        with:
          name: go-release-checksums
          path: artifacts/SHA256SUMS.txt
          retention-days: 30

  # ── Publish GitHub Release ───────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [version, build, checksums]
    permissions:
      contents: write
    if: >
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: go-release-*
          merge-multiple: true
          path: release-artifacts/

      - name: List artifacts
        shell: bash
        run: ls -lh release-artifacts/

      - name: Check release does not already exist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          if gh release view "$TAG" &>/dev/null 2>&1; then
            echo "ERROR: Release $TAG already exists."
            exit 1
          fi
          echo "No existing release for $TAG — proceeding."

      - name: Generate release notes
        shell: bash
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          TAG="${{ needs.version.outputs.tag }}"
          cat > release-notes.md <<EOF
          ## RenderEyeMCP ${TAG} (Go Native Binary)

          Native MCP server bridging AI assistants to RenderDoc GPU frame debugger.
          No Python, uv, pip, or Go required to run.

          ### Quick Start (Windows)

          1. Download \`rendereye-mcp_${VERSION}_windows_amd64.zip\`
          2. Extract and run \`install.ps1\` (or place \`rendereye-mcp.exe\` manually)
          3. Configure Claude Code:
             \`\`\`json
             { "mcpServers": { "rendereye": { "command": "C:\\\\Tools\\\\RenderEyeMCP\\\\rendereye-mcp.exe" } } }
             \`\`\`
          4. Open a RenderDoc capture and ask your agent to inspect it.

          ### Artifacts

          | File | Platform |
          |------|----------|
          | \`rendereye-mcp_${VERSION}_windows_amd64.zip\` | Windows x64 |
          | \`rendereye-mcp_${VERSION}_windows_arm64.zip\` | Windows ARM64 |
          | \`rendereye-mcp_${VERSION}_linux_amd64.tar.gz\` | Linux x64 |
          | \`rendereye-mcp_${VERSION}_linux_arm64.tar.gz\` | Linux ARM64 |
          | \`rendereye-mcp_${VERSION}_darwin_arm64.tar.gz\` | macOS Apple Silicon |
          | \`SHA256SUMS.txt\` | Checksums |

          ### Platform Support

          | Platform | Binary | IPC | MCP | RenderDoc Integration |
          |---|---|---|---|---|
          | Windows amd64 | ✓ | ✓ | ✓ | Primary target |
          | Windows arm64 | ✓ compiled | requires testing | requires testing | requires testing |
          | Linux amd64 | ✓ | ✓ | ✓ | requires RenderDoc |
          | Linux arm64 | ✓ compiled | requires testing | requires testing | requires testing |
          | macOS arm64 | ✓ compiled | requires testing | RenderDoc unavailable | not supported |

          See [docs/en/installation.md](https://github.com/${{ github.repository }}/blob/main/docs/en/installation.md) for full instructions.
          EOF

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          TAG="${{ needs.version.outputs.tag }}"
          PRERELEASE="${{ needs.version.outputs.is_prerelease }}"
          PRERELEASE_FLAG=""
          [[ "$PRERELEASE" == "true" ]] && PRERELEASE_FLAG="--prerelease"
          gh release create "$TAG" \
            --title "RenderEyeMCP $TAG" \
            --notes-file release-notes.md \
            $PRERELEASE_FLAG \
            release-artifacts/*.zip \
            release-artifacts/*.tar.gz \
            release-artifacts/SHA256SUMS.txt
          echo "Release published: $(gh release view "$TAG" --json url -q .url)"
