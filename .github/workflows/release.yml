name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─── Tests ───────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...

  # ─── Build + Package ─────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: windows
            goarch: amd64
            runner: windows-latest
            ext: .exe
            archive: zip
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
            ext: ''
            archive: tar.gz

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}"   >> "$GITHUB_OUTPUT"
          echo "date=${DATE}"       >> "$GITHUB_OUTPUT"
          echo "name=RenderEyeMCP-v${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}  Commit: ${COMMIT}"

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build \
            -ldflags "-s -w \
              -X github.com/taqu/rendereye-mcp/internal/version.Version=${{ steps.ver.outputs.version }} \
              -X github.com/taqu/rendereye-mcp/internal/version.GitCommit=${{ steps.ver.outputs.commit }} \
              -X github.com/taqu/rendereye-mcp/internal/version.BuildDate=${{ steps.ver.outputs.date }}" \
            -o rendereye-mcp${{ matrix.ext }} \
            ./cmd/rendereye-mcp/

      - name: Smoke test
        shell: bash
        run: ./rendereye-mcp${{ matrix.ext }} version

      - name: Assemble archive
        shell: bash
        run: |
          NAME="${{ steps.ver.outputs.name }}"
          mkdir -p "${NAME}"
          cp rendereye-mcp${{ matrix.ext }} "${NAME}/"

          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            # install.ps1 looks for an "extensions" directory alongside the script
            cp scripts/install.ps1 "${NAME}/"
            mkdir -p "${NAME}/extensions"
            cp -r extensions/rendereye/. "${NAME}/extensions/"
          else
            # install.sh looks for an "extension" directory alongside the script
            cp scripts/install.sh "${NAME}/"
            chmod +x "${NAME}/install.sh"
            mkdir -p "${NAME}/extension"
            cp -r extensions/rendereye/. "${NAME}/extension/"
          fi

          [[ -f README.md ]] && cp README.md "${NAME}/"
          [[ -f LICENSE   ]] && cp LICENSE   "${NAME}/"

      - name: Verify archive contents
        shell: bash
        run: |
          NAME="${{ steps.ver.outputs.name }}"

          fail() { echo "FAIL: $*"; exit 1; }

          [[ -f "${NAME}/rendereye-mcp${{ matrix.ext }}" ]] || fail "executable missing"

          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            [[ -f "${NAME}/install.ps1" ]]                || fail "install.ps1 missing"
            [[ -d "${NAME}/extensions" ]]                 || fail "extensions/ missing"
            [[ -f "${NAME}/extensions/__init__.py" ]]     || fail "extensions/__init__.py missing"
            [[ -f "${NAME}/extensions/extension.json" ]]  || fail "extensions/extension.json missing"
          else
            [[ -f "${NAME}/install.sh" ]]                 || fail "install.sh missing"
            [[ -x "${NAME}/install.sh" ]]                 || fail "install.sh not executable"
            [[ -d "${NAME}/extension" ]]                  || fail "extension/ missing"
            [[ -f "${NAME}/extension/__init__.py" ]]      || fail "extension/__init__.py missing"
            [[ -f "${NAME}/extension/extension.json" ]]   || fail "extension/extension.json missing"
            [[ -x "${NAME}/rendereye-mcp" ]]              || fail "rendereye-mcp not executable"
          fi

          # No legacy Python MCP server files
          find "${NAME}" -name "server.py" | grep -q . && fail "legacy server.py found" || true

          echo "OK: ${NAME}"
          find "${NAME}" -type f | sort

      - name: Create archive (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          NAME="${{ steps.ver.outputs.name }}"
          mkdir -p dist
          tar -caf "dist/${NAME}.zip" "${NAME}/"
          [[ -f "dist/${NAME}.zip" ]] || { echo "ERROR: archive not created: dist/${NAME}.zip"; exit 1; }
          ls -lh "dist/${NAME}.zip"

      - name: Create archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          NAME="${{ steps.ver.outputs.name }}"
          mkdir -p dist
          tar -czf "dist/${NAME}.tar.gz" "${NAME}/"
          [[ -f "dist/${NAME}.tar.gz" ]] || { echo "ERROR: archive not created: dist/${NAME}.tar.gz"; exit 1; }
          ls -lh "dist/${NAME}.tar.gz"

      - name: Checksum
        shell: bash
        run: |
          NAME="${{ steps.ver.outputs.name }}"
          EXT="${{ matrix.archive }}"
          [[ -f "dist/${NAME}.${EXT}" ]] || { echo "ERROR: archive missing: dist/${NAME}.${EXT}"; exit 1; }
          sha256sum "dist/${NAME}.${EXT}" > "dist/${NAME}.sha256"
          cat "dist/${NAME}.sha256"

      - name: Verify checksum
        shell: bash
        run: |
          NAME="${{ steps.ver.outputs.name }}"
          sha256sum --check "dist/${NAME}.sha256"
          echo "Checksum verified"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/RenderEyeMCP-*.${{ matrix.archive }}
            dist/RenderEyeMCP-*.sha256
          if-no-files-found: error
          retention-days: 14

  # ─── Checksums ───────────────────────────────────────────────────────────────
  checksums:
    name: Checksums
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/

      - name: Combine checksums
        run: |
          cd dist
          cat *.sha256 | sort > checksums.txt
          echo "--- checksums.txt ---"
          cat checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: dist/checksums.txt
          if-no-files-found: error
          retention-days: 14

  # ─── Publish ─────────────────────────────────────────────────────────────────
  #
  # Only runs on tag pushes. Manual workflow_dispatch runs stop after the
  # checksums job — archives are available as workflow artifacts for inspection.
  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build, checksums]
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/

      - name: Verify all artifacts present
        run: |
          MISSING=0
          for pat in "*.zip" "*.tar.gz" "checksums.txt"; do
            ls dist/$pat 2>/dev/null | grep -q . || { echo "MISSING: $pat"; MISSING=1; }
          done
          [[ $MISSING -eq 0 ]] || exit 1
          echo "All artifacts present:"
          ls -lh dist/

      - name: Check release does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "${TAG}" &>/dev/null; then
            echo "ERROR: Release ${TAG} already exists"
            exit 1
          fi
          echo "OK: no existing release for ${TAG}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PRERELEASE=""
          [[ "${VERSION}" == *"-"* ]] && PRERELEASE="--prerelease"
          gh release create "${TAG}" \
            --title "RenderEyeMCP ${TAG}" \
            --generate-notes \
            ${PRERELEASE} \
            dist/*.zip \
            dist/*.tar.gz \
            dist/checksums.txt
          echo "Published: $(gh release view "${TAG}" --json url -q .url)"
